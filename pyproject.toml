[build-system]
requires = [
    "numpy",
    "pybind11",
    "scikit-build-core"
]
build-backend = "scikit_build_core.build"

[project]
name = "orbslam3"
version = "0.0.1"
description = "ORB-SLAM3 Python bindings"
authors = [
    { name="Robaire Galliath", email="galliath.robaire@gmail.com" }
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.8"

[tool.scikit-build-core]
install-dir = "orbslam3"

[tool.scikit-build-core.cmake.define]
SKBUILD = "ON"

[tool.scikit-build-core.sdist]
include = ["orbslam3/*", "CMakeLists.txt"]
